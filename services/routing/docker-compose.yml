# Local development only. These credentials are not secrets.
name: stableflow-routing

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stableflow
      POSTGRES_PASSWORD: stableflow_dev
      POSTGRES_DB: stableflow
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stableflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: services/routing/Dockerfile
    environment:
      STABLEFLOW_ENV: sandbox
      DATABASE_URL: postgresql://stableflow:stableflow_dev@postgres:5432/stableflow
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
